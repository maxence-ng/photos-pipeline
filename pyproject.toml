[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "photos-pipeline"
version = "0.1.0"
description = "Automated photo post-processing pipeline: ingest, cull, correct, and export."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "photos-pipeline contributors" }]
keywords = ["photography", "pipeline", "culling", "darktable", "exiftool"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "opencv-python-headless>=4.9",
    "Pillow>=10.3",
    "numpy>=1.26",
    "rawpy>=0.21",
    "torch>=2.2",
    "torchvision>=0.17",
    "click>=8.1",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "rich>=13.7",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "python-multipart>=0.0.9",
    "exifread>=2.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "pytest-mock>=3.14",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.4",
    "black>=24.4",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "piexif>=1.1",
]

[project.scripts]
photos-pipeline = "photos_pipeline.cli:main"

[project.urls]
Homepage = "https://github.com/maxence-ng/photos-pipeline"
Issues = "https://github.com/maxence-ng/photos-pipeline/issues"

# ---------------------------------------------------------------------------
# Hatch
# ---------------------------------------------------------------------------
[tool.hatch.build.targets.wheel]
packages = ["src/photos_pipeline"]

# ---------------------------------------------------------------------------
# Ruff
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["photos_pipeline"]

# ---------------------------------------------------------------------------
# Black
# ---------------------------------------------------------------------------
[tool.black]
line-length = 100
target-version = ["py311"]

# ---------------------------------------------------------------------------
# Mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
warn_unused_ignores = true
warn_return_any = true

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
    "unit: fast, isolated unit tests",
    "integration: tests that call external processes or the real filesystem",
    "slow: tests that take >5 seconds",
]
asyncio_mode = "auto"

# ---------------------------------------------------------------------------
# Coverage
# ---------------------------------------------------------------------------
[tool.coverage.run]
source = ["src/photos_pipeline"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true
